[package]
name = "revmo"
version = "1.0.0"
edition = "2021"

[dependencies]
iced = {version = "0.13.1", features = ["debug", "image", "svg"]}
bincode = "1.3.3"
serde = { version = "1.0.215", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true 
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"