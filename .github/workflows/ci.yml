name: CI

# Checks pull requests; merges to main are handled by release.yml.
# Only changes that can affect the build need checking: the sources, the
# manifest and lockfile, the fonts src/styles.rs embeds, and this workflow.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'fonts/**'
      - '.github/workflows/ci.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
